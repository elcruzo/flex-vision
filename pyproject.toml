[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-preprocess-graph"
version = "0.0.1"
description = "Experimental preprocessing graph contracts and explicit reference execution"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "PyYAML>=6.0.2"]

[project.scripts]
cpg = "cpg.cli:main"

[project.optional-dependencies]
cuda = ["cupy-cuda13x>=14.2,<15"]
reference = ["torch>=2.8", "torchvision>=0.23"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
